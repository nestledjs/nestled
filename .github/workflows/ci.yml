name: CI

on:
  push:
    branches:
      - develop
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      # Nx Cloud, per Nx's recommendation: pushes use the read-write token; pull requests use the
      # read-only token (a scoped per-PR cache, and read-only tokens can still use workers), so PR code
      # can never write into the cache develop and releases trust. Fork PRs get no secrets and run with
      # the workspace's anonymous access (none).
      NX_CLOUD_ACCESS_TOKEN: ${{ github.event_name == 'push' && secrets.NX_CLOUD_ACCESS_TOKEN || secrets.NX_CLOUD_ACCESS_TOKEN_READ }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies (triggers postinstall + playwright install)
        run: pnpm install --frozen-lockfile

      - name: Verify browser installation
        run: |
          if [ ! -f ~/.cache/ms-playwright/chromium-*/*/chrome-linux/headless_shell ]; then
            echo "Browser install incomplete. Reinstalling..."
            pnpm exec playwright install --with-deps
          fi

      # Enable Nx Cloud Distributed CI (keep this)
      - run: pnpm dlx nx-cloud start-ci-run --distribute-on="3 linux-medium-js" --stop-workers-after="build"

      - uses: nrwl/nx-set-shas@v4

      - name: Run affected commands
        run: pnpm exec nx affected -t lint test build
